[package]
name = "hintcontrol-gtk"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.10" }
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "native-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
